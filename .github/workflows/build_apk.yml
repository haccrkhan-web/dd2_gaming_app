name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Standalone App Package
        run: |
          cd $RUNNER_TEMP
          flutter create --platforms=android --org com.dd1casino vip_app
          cd vip_app
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/dd1-vip-casino.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DD1-VIP-Casino-APK
          path: dd1-vip-casino.apk
          
