name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Native Wrappers Safely
        run: |
          mkdir -p temp_store
          cp lib/main.dart temp_store/main.dart
          cp pubspec.yaml temp_store/pubspec.yaml
          flutter create --platforms=android --org com.dd1casino .
          cp temp_store/main.dart lib/main.dart
          cp temp_store/pubspec.yaml pubspec.yaml

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DD1-VIP-Casino-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
