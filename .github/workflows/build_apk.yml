name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Project & Build APK
        run: |
          mkdir -p /tmp/app_source
          cp lib/main.dart /tmp/app_source/main.dart
          
          cd /tmp
          flutter create --platforms=android --org com.dd1casino dd1_casino_app
          cd dd1_casino_app
          
          cp /tmp/app_source/main.dart lib/main.dart
          
          flutter build apk --release --no-tree-shake-icons
          
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/DD1-VIP-Casino-Release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DD1-VIP-Casino-APK
          path: DD1-VIP-Casino-Release.apk
